# ─────────────────────────────────────────────────────────────
# Conf Nginx pour app React/Vite (Clarivi BUILD / IMOTION)
# Servie derrière un reverse proxy TLS (Caddy / Traefik / Hostinger).
# ─────────────────────────────────────────────────────────────
server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Compression
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_proxied    any;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/javascript application/javascript
        application/json application/xml application/rss+xml
        image/svg+xml font/woff2;

    # Sécurité (headers minimum — TLS/HSTS doit être ajouté par le reverse proxy)
    # CSP : politique compatible Vite/React/Supabase (compensation XSS pour les
    # jetons de session lisibles en JS — cf. findings H1/H2/B2).
    add_header Content-Security-Policy    "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options    "nosniff"                 always;
    add_header X-Frame-Options           "DENY"                    always;
    # X-XSS-Protection supprimé : en-tête obsolète (recommandation B2,
    # pouvait introduire des vulnérabilités sur les vieux navigateurs).
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;

    # Healthcheck
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Assets fingerprintés Vite : cache long, immuable
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Fichiers statiques avec hash (images, polices, etc.)
    location ~* \.(?:js|css|woff2?|ttf|otf|eot|ico|png|jpg|jpeg|gif|svg|webp|avif|mp4|webm)$ {
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    # index.html : ne JAMAIS mettre en cache (sinon nouvelles versions invisibles)
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires off;
    }

    # SPA fallback : toutes les routes React Router servent index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Bloquer les fichiers sensibles potentiellement déployés par erreur
    location ~ /\.(?:env|git|ht|DS_Store) {
        deny all;
        return 404;
    }
}
